<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>QuickNotes</h1>
        
        <section class="controls">
            <button id="load-btn">Load notes</button>
            <p id="status" role="status" aria-live="polite"></p>
        </section>

        <section class="form-section">
            <form id="note-form">
                <div class="field">
                    <label for="title-input">Title (required, max 100 characters):</label>
                    <input type="text" id="title-input" maxlength="100" required>
                </div>
                <div class="field">
                    <label for="body-input">Body (optional):</label>
                    <textarea id="body-input" rows="3"></textarea>
                </div>
                <button type="submit" id="submit-btn">Create Note</button>
            </form>
        </section>

        <section class="notes-section">
            <h2>Notes Feed</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>
</body>
</html>
